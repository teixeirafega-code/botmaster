name: ShortMaster scheduled publishing

run-name: >-
  ShortMaster
  ${{ github.event_name == 'workflow_dispatch' && inputs.upload_mode || 'scheduled' }}

on:
  schedule:
    # America/Sao_Paulo (UTC-3): 22:00, 08:00, 11:30, 15:00, 18:30.
    - cron: "0 1 * * *"
    - cron: "0 11 * * *"
    - cron: "30 14 * * *"
    - cron: "0 18 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      upload_mode:
        description: "Manual run mode"
        required: true
        type: choice
        default: paper
        options:
          - paper
          - real_upload

permissions:
  contents: read

concurrency:
  group: shortmaster-scheduled-publishing
  cancel-in-progress: false

jobs:
  generate-and-publish-one:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: project4/shortmaster_bot
    env:
      SHORTSMASTER_ENV: production
      PAPER_MODE: ${{ (github.event_name == 'schedule' || inputs.upload_mode == 'real_upload') && 'false' || 'true' }}
      ENABLE_REAL_UPLOAD: ${{ (github.event_name == 'schedule' || inputs.upload_mode == 'real_upload') && 'true' || 'false' }}
      LIVE_UPLOAD_ENABLED: ${{ (github.event_name == 'schedule' || inputs.upload_mode == 'real_upload') && 'true' || 'false' }}
      MANUAL_APPROVAL_REQUIRED: "false"
      AUTO_APPROVE_LIVE_UPLOAD: "true"
      DAILY_UPLOAD_LIMIT: "5"
      MAX_DAILY_UPLOAD_LIMIT: "5"
      GENERATION_ATTEMPT_LIMIT: "3"
      MIN_UPLOAD_QUALITY_SCORE: "75"
      MIN_UPLOAD_SAFETY_SCORE: "90"
      YOUTUBE_PRIVACY_STATUS: private
      YOUTUBE_OAUTH_MODE: disabled
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      YOUTUBE_CHANNEL_NAME: ${{ secrets.YOUTUBE_CHANNEL_NAME }}
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      REDDIT_OFFICIAL_API_ENABLED: "true"
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_ORIGINAL_FALLBACK_ENABLED: "true"
      REDDIT_STORY_BACKGROUND_MODE: custom_background_library
      BACKGROUND_LIBRARY_DIR: background_library
      BACKGROUND_LIBRARY_MANIFEST: background_library_manifest.json
      OLLAMA_SCRIPT_ENABLED: "false"
      TIKTOK_MONITOR_ENABLED: "false"
      VOICE_PROFILE: male_storyteller
      TELEGRAM_ALERTS_ENABLED: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && 'true' || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BOTMASTER_DASHBOARD_URL: https://botmaster-l17d.onrender.com
      BOTMASTER_STATUS_TOKEN: ${{ secrets.BOTMASTER_STATUS_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project4/shortmaster_bot/requirements.txt

      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Confirm selected run mode
        run: |
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "manual_upload_mode=${{ inputs.upload_mode || 'not-applicable' }}"
          echo "PAPER_MODE=${PAPER_MODE}"
          echo "ENABLE_REAL_UPLOAD=${ENABLE_REAL_UPLOAD}"
          echo "LIVE_UPLOAD_ENABLED=${LIVE_UPLOAD_ENABLED}"
          echo "YOUTUBE_PRIVACY_STATUS=${YOUTUBE_PRIVACY_STATUS}"

      - name: Restore persistent ShortMaster state
        uses: actions/cache/restore@v4
        with:
          path: project4/shortmaster_bot/data
          key: shortmaster-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            shortmaster-state-

      - name: Validate real upload secrets
        if: ${{ github.event_name == 'schedule' || inputs.upload_mode == 'real_upload' }}
        run: |
          python -c "import os; required=['YOUTUBE_CHANNEL_ID','YOUTUBE_CLIENT_SECRET_JSON','YOUTUBE_TOKEN_JSON']; missing=[name for name in required if not os.getenv(name)]; assert not missing, 'Missing GitHub Actions secrets: ' + ', '.join(missing)"

      - name: Run one bounded publishing job
        run: |
          mkdir -p logs reports
          set -o pipefail
          python -m app.main scheduled-job --job-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>&1 | tee "logs/github-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"

      - name: Write workflow summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          report_path = pathlib.Path("reports/scheduled_job_report.json")
          report = (
              json.loads(report_path.read_text(encoding="utf-8"))
              if report_path.exists()
              else {"status": "missing_report"}
          )
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "# ShortMaster scheduled job\n\n"
              f"- event: {os.environ.get('GITHUB_EVENT_NAME', '')}\n"
              f"- manual_upload_mode: ${{ inputs.upload_mode || 'not-applicable' }}\n"
              f"- PAPER_MODE: {os.environ.get('PAPER_MODE', '')}\n"
              f"- ENABLE_REAL_UPLOAD: {os.environ.get('ENABLE_REAL_UPLOAD', '')}\n"
              f"- LIVE_UPLOAD_ENABLED: {os.environ.get('LIVE_UPLOAD_ENABLED', '')}\n\n"
              "```json\n"
              + json.dumps(report, indent=2, ensure_ascii=False)
              + "\n```\n",
              encoding="utf-8",
          )
          PY

      - name: Require real upload for manual real_upload runs
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.upload_mode == 'real_upload' }}
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          report_path = pathlib.Path("reports/scheduled_job_report.json")
          if not report_path.exists():
              raise SystemExit("scheduled_job_report.json was not created")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if int(report.get("uploaded_count") or 0) < 1:
              reason = (
                  report.get("error")
                  or report.get("upload_result", {}).get("reason")
                  or report.get("generation_result", {}).get("reason")
                  or report.get("status")
                  or "manual real_upload run completed without an upload"
              )
              raise SystemExit(f"manual real_upload did not upload a video: {reason}")
          print("manual real_upload uploaded one video")
          PY

      - name: Save persistent ShortMaster state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: project4/shortmaster_bot/data
          key: shortmaster-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shortmaster-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            project4/shortmaster_bot/logs/
            project4/shortmaster_bot/reports/
          if-no-files-found: warn
          retention-days: 30
