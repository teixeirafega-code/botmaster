services:
  - type: worker
    name: botmaster-shortmaster
    runtime: docker
    plan: starter
    autoDeploy: true
    rootDir: project4/shortmaster_bot
    dockerfilePath: ./project4/shortmaster_bot/Dockerfile
    dockerContext: ./project4/shortmaster_bot
    dockerCommand: python -m app.main run
    disk:
      name: botmaster-shortmaster-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SHORTSMASTER_ENV
        value: production
      - key: BOTMASTER_DASHBOARD_URL
        value: https://botmaster-l17d.onrender.com
      - key: BOTMASTER_STATUS_TOKEN
        fromService:
          name: botmaster-dashboard
          type: web
          envVarKey: BOTMASTER_STATUS_TOKEN
      - key: SHORTSMASTER_STORAGE_DIR
        value: /var/data/shortmaster
      - key: DATABASE_PATH
        value: /var/data/shortmaster/shortmaster.db
      - key: VIDEOS_DIR
        value: videos
      - key: REPORTS_DIR
        value: reports
      - key: LOGS_DIR
        value: logs
      - key: PAPER_MODE
        value: "false"
      - key: ENABLE_REAL_UPLOAD
        value: "true"
      - key: LIVE_UPLOAD_ENABLED
        value: "true"
      - key: MANUAL_APPROVAL_REQUIRED
        value: "false"
      - key: AUTO_APPROVE_LIVE_UPLOAD
        value: "true"
      - key: REDDIT_STORY_BACKGROUND_MODE
        value: custom_background_library
      - key: BACKGROUND_LIBRARY_DIR
        value: background_library
      - key: BACKGROUND_LIBRARY_MANIFEST
        value: background_library_manifest.json
      - key: TIKTOK_MONITOR_ENABLED
        value: "false"
      - key: OLLAMA_SCRIPT_ENABLED
        value: "false"
      - key: DAILY_UPLOAD_LIMIT
        value: "5"
      - key: MAX_DAILY_UPLOAD_LIMIT
        value: "5"
      - key: UPLOAD_SLOTS_PER_DAY
        value: "5"
      - key: HEARTBEAT_INTERVAL_MINUTES
        value: "5"
      - key: RETENTION_SCENE_COUNT
        value: "10"
      - key: MAX_VISUAL_BEAT_SECONDS
        value: "2.0"
      - key: MIN_SCENE_COUNT
        value: "8"
      - key: MIN_HOOK_SCORE
        value: "70"
      - key: MIN_RETENTION_SCORE
        value: "72"
      - key: MIN_VISUAL_INTEREST_SCORE
        value: "70"
      - key: MIN_UPLOAD_QUALITY_SCORE
        value: "75"
      - key: MIN_UPLOAD_SAFETY_SCORE
        value: "90"
      - key: YOUTUBE_PRIVACY_STATUS
        value: private
      - key: YOUTUBE_OAUTH_MODE
        value: disabled
      - key: YOUTUBE_CHANNEL_ID
        sync: false
      - key: YOUTUBE_CHANNEL_NAME
        sync: false
      - key: YOUTUBE_CLIENT_SECRET_JSON
        sync: false
      - key: YOUTUBE_TOKEN_JSON
        sync: false
      - key: TELEGRAM_ALERTS_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
